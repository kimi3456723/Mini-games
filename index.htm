<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D射擊</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
#game { width: 100vw; height: 100vh; display: block; }
#ui {
  position: fixed; top: 10px; left: 10px; color: #0f0; font-family: monospace;
  font-size: 18px; z-index: 10; pointer-events: none; text-shadow: 0 0 5px #0f0;
}
#crosshair {
  position: fixed; top: 50%; left: 50%; width: 20px; height: 20px;
  transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(0,255,0,0.8);
}
#crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
#crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">分數: <span id="score">0</span></div>
<div id="crosshair"></div>
<script>
const canvas = document.getElementById('game');
const scoreEl = document.getElementById('score');
let score = 0;

// 場景
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.Fog(0x050510, 10, 60);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// 燈光
scene.add(new THREE.AmbientLight(0x404060));
const dl = new THREE.DirectionalLight(0xffffff, 0.6);
dl.position.set(10, 20, 10);
scene.add(dl);

// 地面
const grid = new THREE.GridHelper(100, 50, 0x00aa66, 0x112211);
scene.add(grid);
const plane = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshBasicMaterial({ color: 0x0a0a15 })
);
plane.rotation.x = -Math.PI/2;
plane.position.y = -0.1;
scene.add(plane);

// 玩家位置
camera.position.set(0, 1.6, 0);

// 敵人
const enemies = [];
const enemyGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
const enemyMat = new THREE.MeshPhongMaterial({ color: 0xff0044, emissive: 0x330011 });
const enemiesContainer = new THREE.Group();
scene.add(enemiesContainer);

function spawnEnemy() {
  const mesh = new THREE.Mesh(enemyGeo, enemyMat);
  const angle = Math.random() * Math.PI * 2;
  const dist = 20 + Math.random() * 15;
  mesh.position.set(Math.cos(angle)*dist, 0.6, Math.sin(angle)*dist);
  mesh.userData = { speed: 0.03 + Math.random()*0.04, hp: 1 };
  enemiesContainer.add(mesh);
  enemies.push(mesh);
}

// 子彈
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
const bulletsContainer = new THREE.Group();
scene.add(bulletsContainer);

// 外部音效
const shootSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
const hitSound = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3');
shootSound.volume = 0.3;
hitSound.volume = 0.3;

function playShoot() {
  shootSound.currentTime = 0;
  shootSound.play().catch(()=>{});
}
function playHit() {
  hitSound.currentTime = 0;
  hitSound.play().catch(()=>{});
}

// 控制變數
let yaw = 0, pitch = 0;
let touchStartX = 0, touchStartY = 0;
let touchMoved = false;
let isDragging = false;

// 手機觸控
canvas.addEventListener('touchstart', e => {
  if(e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMoved = false;
    isDragging = true;
  }
}, {passive: false});

canvas.addEventListener('touchmove', e => {
  if(!isDragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if(Math.abs(dx) > 3 || Math.abs(dy) > 3) touchMoved = true;
  yaw -= dx * 0.008;
  pitch -= dy * 0.008;
  pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  e.preventDefault();
}, {passive: false});

canvas.addEventListener('touchend', e => {
  if(isDragging && !touchMoved) {
    shoot();
  }
  isDragging = false;
});

// 電腦滑鼠
document.addEventListener('mousemove', e => {
  yaw -= e.movementX * 0.005;
  pitch -= e.movementY * 0.005;
  pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
});
document.addEventListener('click', shoot);

function shoot() {
  playShoot();
  const bullet = new THREE.Mesh(bulletGeo, bulletMat);
  bullet.position.copy(camera.position);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  bullet.userData = { velocity: dir.multiplyScalar(1.2), life: 80 };
  bulletsContainer.add(bullet);
  bullets.push(bullet);
}

// 鍵盤（電腦移動）
const keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// 遊戲循環
let lastTime = performance.now();
function update(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;
  
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  
  // 電腦移動
  const speed = 3 * dt;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();
  const right = new THREE.Vector3();
  right.crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
  if(keys['w'] || keys['ArrowUp']) camera.position.addScaledVector(dir, speed);
  if(keys['s'] || keys['ArrowDown']) camera.position.addScaledVector(dir, -speed);
  if(keys['a'] || keys['ArrowLeft']) camera.position.addScaledVector(right, -speed);
  if(keys['d'] || keys['ArrowRight']) camera.position.addScaledVector(right, speed);
  
  // 更新子彈
  for(let i = bullets.length-1; i>=0; i--) {
    const b = bullets[i];
    b.position.addScaledVector(b.userData.velocity, dt * 60);
    b.userData.life--;
    if(b.userData.life <= 0) {
      bulletsContainer.remove(b);
      bullets.splice(i, 1);
    }
  }
  
  // 更新敵人
  for(let i = enemies.length-1; i>=0; i--) {
    const e = enemies[i];
    const toPlayer = new THREE.Vector3().subVectors(camera.position, e.position);
    toPlayer.y = 0;
    const dist = toPlayer.length();
    toPlayer.normalize();
    e.position.addScaledVector(toPlayer, e.userData.speed);
    e.lookAt(camera.position);
    
    if(dist < 1.2) {
      enemiesContainer.remove(e);
      enemies.splice(i, 1);
      score = Math.max(0, score - 10);
      scoreEl.textContent = score;
      continue;
    }
    
    for(let j = bullets.length-1; j>=0; j--) {
      const b = bullets[j];
      if(e.position.distanceTo(b.position) < 1) {
        playHit();
        enemiesContainer.remove(e);
        enemies.splice(i, 1);
        bulletsContainer.remove(b);
        bullets.splice(j, 1);
        score += 10;
        scoreEl.textContent = score;
        break;
      }
    }
  }
  
  if(enemies.length < 8 && Math.random() < 0.03) spawnEnemy();
  
  renderer.render(scene, camera);
  requestAnimationFrame(update);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

for(let i=0; i<5; i++) spawnEnemy();
requestAnimationFrame(update);
</script>
</body>
</html>
